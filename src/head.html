<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Liner Notes: editorial, type-first. Fraunces (expressive serif display) + DM Sans (quiet UI sans).
   White ground, ink rules, one cobalt accent. Light maple fretboard as the picture. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111214);--ink:light-dark(#121212,#f1efea);--mut:light-dark(#5f5f5f,#a7a7a7);--line:light-dark(#dcdcdc,#2e2f33);--rule:light-dark(#121212,#f1efea);--panel:light-dark(#f5f5f2,#1a1b1e);--acc:light-dark(#1f3fd6,#3f5ef2);--acch:light-dark(#1631ad,#2f4fe0);--acci:light-dark(#1f3fd6,#8ea2ff);--accs:light-dark(#e8ecfd,#1b2246);--good:light-dark(#1b7a3d,#5cc985);--bad:light-dark(#bf242b,#ff7a7a);--disp:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 var(--sans);overflow-x:clip}
.band{padding:clamp(22px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);font-weight:500;line-height:1.02;letter-spacing:-.015em;text-wrap:balance;margin:0}
.top{background:var(--bg);color:var(--ink);padding-bottom:0;border-bottom:1px solid var(--rule)}
.top h1{font-size:clamp(40px,6.4vw,76px);line-height:.98;letter-spacing:-.02em}
.top p{margin:14px 0 22px;color:var(--mut);max-width:62ch}
.top p a{color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:0 24px}
.tab{background:none;color:var(--mut);border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 0 12px;text-align:left;cursor:pointer;font:inherit;min-height:44px}
.tab b{display:block;font:600 18px/1.2 var(--disp);letter-spacing:-.005em}
.tab span{font-size:12.5px;color:var(--mut)}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
.bar h2{font-size:clamp(32px,4.4vw,44px)}
.bar p{margin:6px 0 0;color:var(--mut)}
.seg{display:flex;border:1px solid var(--rule)}
.seg button{border:0;background:var(--bg);font:600 15px var(--sans);color:var(--ink);padding:11px 22px;border-radius:0;cursor:pointer;min-height:44px}
.seg button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 16px;font:500 15px var(--sans);cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--ink)}
.chip.on{border-color:var(--acc);color:var(--acci);background:var(--accs);font-weight:600}
.status{margin:18px 0 8px;font-size:13.5px;color:var(--mut);display:flex;gap:18px;flex-wrap:wrap}
.status b{color:var(--ink)}
.prompt{font:500 clamp(20px,2.4vw,26px)/1.3 var(--disp);margin:0 0 14px;min-height:2.4em;max-width:62ch}
.board{overflow-x:auto;margin:0 -4px;padding:4px}
.board svg{display:block;width:100%;min-width:680px;height:auto;user-select:none}
.cell{fill:transparent;cursor:pointer}.cell:hover{fill:#1f3fd61f}
.mk text{font:700 13px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk circle{pointer-events:none}
.k-root circle{fill:#1f3fd6;stroke:#fff;stroke-width:2}.k-root text{fill:#fff}
.k-q circle{fill:#fff;stroke:#121212;stroke-width:2.5;stroke-dasharray:4 3}.k-q text{fill:#121212}
.k-ghost circle{fill:#ffffffb3;stroke:#7a7466;stroke-width:1.5}.k-ghost text{fill:#3a362f}
.k-good circle{fill:#1b7a3d;stroke:#fff;stroke-width:2}.k-good text{fill:#fff}
.k-bad circle{fill:#bf242b;stroke:#fff;stroke-width:2}.k-bad text{fill:#fff}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:10px;margin:18px 0 0}
.ch{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:2px;padding:14px 16px;font:500 17px var(--sans);cursor:pointer;min-height:54px;text-align:left}
.ch:hover:not(:disabled){border-color:var(--ink)}
.ch kbd{font:600 12px var(--sans);color:var(--mut);margin-right:10px}
.ch.good{border:1.5px solid var(--good);background:color-mix(in srgb,var(--good) 10%,var(--bg))}
.ch.bad{border:1.5px solid var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--bg))}
.ch.sel{border-color:var(--acc)}
.ch:disabled{cursor:default}
.fbk{margin:18px 0 0;padding:14px 0;border-top:1px solid var(--rule);min-height:52px;max-width:80ch}
.fbk:empty{display:none}
.fbk .ok{color:var(--good)}.fbk .no{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 0}
.btn{border:1px solid var(--rule);border-radius:0;padding:12px 22px;font:600 15px var(--sans);cursor:pointer;min-height:46px;background:var(--bg);color:var(--ink)}
.btn.main{background:var(--ink);color:var(--bg)}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--acci);outline-offset:2px}
.score{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;padding:28px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.big{font:500 clamp(68px,10vw,104px)/1 var(--disp);color:var(--acci);letter-spacing:-.03em}
.big small{font-size:.42em;color:var(--mut)}
.score h3{font-size:32px}.score p{margin:6px 0 0;color:var(--mut)}
.miss{border-top:1px solid var(--line);padding:14px 0}
.miss p{margin:4px 0}.miss .y{color:var(--bad)}.miss .c{color:var(--good)}
.notes{border-top:1px solid var(--rule)}
.notes h3{font-size:30px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px 48px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.notes ul{padding-left:20px;margin:8px 0}.notes li{margin:5px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:13.5px;border-bottom-color:var(--rule)}
td.n{white-space:nowrap}
.tuning{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 14px}
.tuning b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);color:var(--ink);font:600 20px var(--disp)}
.tuning i{font-style:normal;font-size:14px;color:var(--mut);padding:0 4px}
.tuning i.odd{color:var(--acci);font-weight:600}
.small{font-size:14px;color:var(--mut)}
.vidp{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0!important}.vidp:empty{display:none}
.vid{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 18px 10px 14px;border-radius:2px;border:0;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
.vid:hover{background:var(--acch)}.vid svg{flex:none}
@media(max-width:600px){.tabs{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding-inline:16px;gap:0 18px}.tab{flex:none;scroll-snap-align:start}.tab b{font-size:16.5px}}
.parts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;margin:0 0 22px;font-size:13.5px;letter-spacing:.01em}
.parts a,.parts span{color:var(--mut);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
.parts a:hover{color:var(--ink)}.parts span{color:var(--ink);border-color:var(--acc);font-weight:600}
.allp{position:relative}.allp summary{cursor:pointer;color:var(--mut);padding:4px 0;list-style:none}.allp summary:hover{color:var(--ink)}.allp summary::after{content:" ▾"}
.allp[open] ol{position:absolute;z-index:5;top:100%;left:0;margin:8px 0 0;padding:12px 16px 12px 36px;width:min(440px,90vw);max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--rule);box-shadow:0 14px 34px #0002}
.allp li{padding:3px 0;color:var(--mut)}.allp li a,.allp li span{border:0;padding:0;color:var(--ink)}.allp li a:hover{color:var(--acci)}.allp li b{color:var(--acci)}.allp li span{color:var(--mut);font-weight:400}
.box{fill:#1f3fd60f;stroke:#1f3fd6;stroke-width:2;stroke-dasharray:6 4}
.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.mk{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}}.mk{transform-box:fill-box;transform-origin:center}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band top"><div class="wrap">
  <nav class="parts" aria-label="Workbook parts">{{NAV}}</nav>
  <h1>{{H1}}</h1>
  <p>{{INTRO}} Practise each lesson until it feels automatic, then take its test. Click any fret to hear it.</p>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></header>
<main>
<section class="band"><div class="wrap">
  <div class="bar">
    <div><h2 id="ttl"></h2><p id="sub"></p><p id="vid" class="vidp"></p></div>
    <div class="seg" role="group" aria-label="Mode"><button id="mPr">Practice</button><button id="mTe">Test</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="quiz">
    <div class="status" id="status"></div>
    <p class="prompt" id="prompt" aria-live="polite"></p>
    <div class="board" id="boardWrap"><svg id="fb" viewBox="0 0 1000 232" role="img" aria-label="Guitar fretboard, frets 0 to 15"></svg></div>
    <div class="choices" id="choices"></div>
    <div class="fbk" id="fbk" aria-live="polite"></div>
    <div class="acts">
      <button class="btn main" id="next" disabled>Next</button>
      <button class="btn" id="hear">Hear it</button>
      <button class="btn" id="hint">Hint</button>
    </div>
    <p class="small">Keys: 1–4 choose an answer · Enter for next · H to hear.</p>
  </div>
  <div id="result" hidden></div>
</div></section>
<section class="band notes"><div class="wrap" id="notes"></div></section>
</main>
