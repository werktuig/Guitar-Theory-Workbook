<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a patient teacher at your elbow; calm, clear, encouraging.
   IDEA: a practice workbook laid on a rosewood fretboard.
   PICTURE: the live, clickable fretboard is the page.
   COLOUR and TYPE: rosewood brown header, sunburst orange accent, nickel strings; Barlow Condensed (amp-panel lettering) + Barlow.
   LAYOUT: lesson tabs, then prompt, board, answers, feedback; lesson notes below. */
:root{color-scheme:light dark;--bg:light-dark(#fbfaf7,#13110f);--ink:light-dark(#1d1814,#f1ebe4);--mut:light-dark(#6d6359,#a89d92);--line:light-dark(#e3ddd4,#2e2924);--panel:light-dark(#f2eee7,#1d1a17);--acc:#e0561b;--acci:light-dark(#b5420f,#ff8b57);--good:light-dark(#1b7a3d,#4cc47a);--bad:light-dark(#bf242b,#ff6f6f);--wood:#2b1b13}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(22px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;font-weight:600;line-height:1.05;text-wrap:balance;margin:0}
.top{background:var(--wood);color:#f6eee5;padding-bottom:0}
.top h1{font-size:clamp(34px,5vw,50px)}
.top p{margin:6px 0 18px;color:#d8c9ba;max-width:62ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:#ffffff12;color:#f6eee5;border:0;border-radius:10px 10px 0 0;padding:10px 16px 12px;text-align:left;cursor:pointer;font:inherit;min-height:44px}
.tab b{display:block;font:600 19px/1.1 "Barlow Condensed",sans-serif}
.tab span{font-size:13px;color:#cdbcab}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink)}
.tab[aria-selected=true] span{color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
.bar h2{font-size:clamp(30px,4vw,40px)}
.bar p{margin:4px 0 0;color:var(--mut)}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:4px}
.seg button{border:0;background:none;font:600 16px Barlow,sans-serif;color:var(--ink);padding:10px 18px;border-radius:9px;cursor:pointer;min-height:44px}
.seg button.on{background:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:8px 14px;font:500 15px Barlow,sans-serif;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--acci);color:var(--acci);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.status{margin:18px 0 6px;font-size:14px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap}
.status b{color:var(--ink)}
.prompt{font-size:clamp(18px,2.3vw,22px);font-weight:500;margin:0 0 12px;min-height:2.4em;max-width:70ch}
.board{overflow-x:auto;border-radius:12px;margin:0 -4px;padding:4px}
.board svg{display:block;width:100%;min-width:680px;height:auto;user-select:none}
.cell{fill:transparent;cursor:pointer}.cell:hover{fill:#ffffff22}
.mk text{font:700 13px Barlow,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk circle{pointer-events:none}
.k-root circle{fill:var(--acc);stroke:#fff;stroke-width:2}.k-root text{fill:#fff}
.k-q circle{fill:#f6eee5;stroke:var(--acc);stroke-width:2.5;stroke-dasharray:4 3}.k-q text{fill:#2b1b13}
.k-ghost circle{fill:#ffffff30;stroke:#ffffffaa;stroke-width:1.5}.k-ghost text{fill:#fff}
.k-good circle{fill:#2fa05a;stroke:#fff;stroke-width:2}.k-good text{fill:#fff}
.k-bad circle{fill:#d3343b;stroke:#fff;stroke-width:2}.k-bad text{fill:#fff}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:10px;margin:16px 0 0}
.ch{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:500 17px Barlow,sans-serif;cursor:pointer;min-height:52px;text-align:left}
.ch:hover:not(:disabled){border-color:var(--acci)}
.ch kbd{font:600 12px Barlow,sans-serif;color:var(--mut);margin-right:8px}
.ch.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.ch.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.ch.sel{border-color:var(--acci)}
.ch:disabled{cursor:default}
.fbk{margin:16px 0 0;padding:14px 16px;border-radius:12px;background:var(--panel);min-height:52px;max-width:80ch}
.fbk:empty{display:none}
.fbk .ok{color:var(--good)}.fbk .no{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 0}
.btn{border:0;border-radius:12px;padding:12px 20px;font:600 16px Barlow,sans-serif;cursor:pointer;min-height:46px;background:var(--panel);color:var(--ink)}
.btn.main{background:var(--acc);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--acci);outline-offset:2px}
.score{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:center;padding:24px;border-radius:16px;background:var(--panel)}
.big{font:700 clamp(64px,10vw,96px)/1 "Barlow Condensed",sans-serif;color:var(--acci)}
.big small{font-size:.45em;color:var(--mut)}
.score h3{font-size:30px}.score p{margin:6px 0 0;color:var(--mut)}
.miss{border-top:1px solid var(--line);padding:14px 0}
.miss p{margin:4px 0}.miss .y{color:var(--bad)}.miss .c{color:var(--good)}
.notes{border-top:1px solid var(--line)}
.notes h3{font-size:28px;margin-bottom:10px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px 40px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.notes ul{padding-left:20px;margin:8px 0}.notes li{margin:5px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:14px}
td.n{white-space:nowrap}
.tuning{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 14px}
.tuning b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--wood);color:#f6eee5;font:700 20px "Barlow Condensed",sans-serif}
.tuning i{font-style:normal;font-size:14px;color:var(--mut);padding:0 4px}
.tuning i.odd{color:var(--acci);font-weight:600}
.small{font-size:14px;color:var(--mut)}
.vidp{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0!important}.vidp:empty{display:none}
.vid{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:9px 18px 9px 14px;border-radius:99px;border:0;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;font-size:15px;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 35%,transparent)}
.vid:hover{background:#c74a14}.vid:focus-visible{outline:3px solid var(--acci);outline-offset:2px}.vid svg{flex:none}
@media(max-width:600px){.tabs{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding-inline:16px}.tab{flex:none;scroll-snap-align:start;padding:8px 12px 10px}.tab b{font-size:17px}}
.parts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 14px;font-size:14px}
.parts a,.parts span{color:#d8c9ba;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
.parts a:hover{color:#fff;border-color:#fff6}.parts span{color:#fff;border-color:var(--acc);font-weight:600}
.allp{position:relative}.allp summary{cursor:pointer;color:#d8c9ba;padding:4px 0;list-style:none}.allp summary::after{content:" ▾"}
.allp[open] ol{position:absolute;z-index:5;top:100%;left:0;margin:6px 0 0;padding:10px 14px 10px 34px;width:min(420px,90vw);max-height:60vh;overflow:auto;background:#3a271c;border-radius:12px;box-shadow:0 12px 30px #0008}
.allp li{padding:3px 0;color:#d8c9ba}.allp li a,.allp li span{border:0;padding:0}.allp li b{color:#fff}.allp li span{color:#a8988a;font-weight:400}
.box{fill:#ffffff14;stroke:var(--acc);stroke-width:2;stroke-dasharray:6 4}
.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.mk{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}}.mk{transform-box:fill-box;transform-origin:center}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band top"><div class="wrap">
  <nav class="parts" aria-label="Workbook parts">{{NAV}}</nav>
  <h1>{{H1}}</h1>
  <p>{{INTRO}} Practise each lesson until it feels automatic, then take its test. Click any fret to hear it.</p>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></header>
<main>
<section class="band"><div class="wrap">
  <div class="bar">
    <div><h2 id="ttl"></h2><p id="sub"></p><p id="vid" class="vidp"></p></div>
    <div class="seg" role="group" aria-label="Mode"><button id="mPr">Practice</button><button id="mTe">Test</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="quiz">
    <div class="status" id="status"></div>
    <p class="prompt" id="prompt" aria-live="polite"></p>
    <div class="board" id="boardWrap"><svg id="fb" viewBox="0 0 1000 232" role="img" aria-label="Guitar fretboard, frets 0 to 15"></svg></div>
    <div class="choices" id="choices"></div>
    <div class="fbk" id="fbk" aria-live="polite"></div>
    <div class="acts">
      <button class="btn main" id="next" disabled>Next</button>
      <button class="btn" id="hear">Hear it</button>
      <button class="btn" id="hint">Hint</button>
    </div>
    <p class="small">Keys: 1–4 choose an answer · Enter for next · H to hear.</p>
  </div>
  <div id="result" hidden></div>
</div></section>
<section class="band notes"><div class="wrap" id="notes"></div></section>
</main>
